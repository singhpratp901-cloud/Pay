<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRUS PAY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 20%, #126653 0%, #073e34 45%, #022b25 100%);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 14px;
}

.container{
    width:100%;
    max-width:615px;
}

.card{
    width:100%;
    border:1px solid rgba(255,255,255,.20);
    border-radius:48px;
    background:rgba(4,62,52,.58);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    box-shadow:0 25px 70px rgba(0,0,0,.25);
    overflow:hidden;
    text-align:center;
    padding-top:46px;
}

.logo-box{
    width:250px;
    height:250px;
    margin:0 auto 38px;
    padding:25px;
    border-radius:58px;
    background:#f5f7f6;
    box-shadow:0 0 0 4px rgba(110,255,205,.15);
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:38px;
    border:4px solid #70e8c2;
    background:#202326;
}

h1{
    font-size:58px;
    line-height:1.05;
    font-weight:800;
    letter-spacing:-2px;
    margin:0 35px 34px;
}

.subtitle{
    font-size:26px;
    line-height:1.45;
    font-weight:600;
    color:#d0d9d7;
    margin:0 55px 45px;
}

.info{
    margin:0 36px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border:1px solid rgba(255,255,255,.22);
    border-radius:32px;
    overflow:hidden;
}

.info-item{
    padding:30px 10px;
    border-right:1px solid rgba(255,255,255,.18);
}

.info-item:last-child{
    border-right:none;
}

.label{
    display:block;
    font-size:19px;
    font-weight:700;
    color:#cbd4d2;
    margin-bottom:12px;
}

.value{
    font-size:30px;
    font-weight:800;
}

.download{
    display:block;
    margin:38px 36px 30px;
    padding:23px 15px;
    border-radius:38px;
    background:linear-gradient(100deg,#25e57b,#20d5d6);
    color:#062d28;
    text-decoration:none;
    font-size:30px;
    font-weight:800;
    box-shadow:0 15px 35px rgba(20,225,170,.20);
    transition:.2s;
}

.download:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 45px rgba(20,225,170,.30);
}

.note{
    font-size:22px;
    line-height:1.5;
    color:#d0d8d6;
    font-weight:600;
    padding:0 45px 42px;
}

.footer{
    border-top:1px solid rgba(255,255,255,.16);
    padding:30px 20px;
}

.footer a{
    color:#d9dfdd;
    text-decoration:none;
    font-size:22px;
    margin:0 18px;
}

.age{
    color:#aeb9b6;
    font-size:20px;
    line-height:1.5;
    padding:30px 25px 5px;
}


/* MOBILE */
@media(max-width:600px){

    body{
        padding:20px 10px;
    }

    .card{
        border-radius:42px;
        padding-top:42px;
    }

    .logo-box{
        width:250px;
        height:250px;
        margin-bottom:38px;
    }

    h1{
        font-size:48px;
        margin-left:25px;
        margin-right:25px;
    }

    .subtitle{
        font-size:23px;
        margin-left:30px;
        margin-right:30px;
    }

    .info{
        margin-left:28px;
        margin-right:28px;
    }

    .label{
        font-size:16px;
    }

    .value{
        font-size:25px;
    }

    .download{
        margin-left:28px;
        margin-right:28px;
        font-size:27px;
    }

    .note{
        padding-left:30px;
        padding-right:30px;
        font-size:20px;
    }
}

@media(max-width:400px){

    .logo-box{
        width:220px;
        height:220px;
    }

    h1{
        font-size:42px;
    }

    .subtitle{
        font-size:20px;
    }

    .value{
        font-size:22px;
    }

    .download{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- PHOTO -->
        <div class="logo-box">
            <img
                src="https://i.postimg.cc/vBgYNSSk/file-0000000078c4820bb58c443be573714c.png"
                alt="TRUS PAY"
            >
        </div>

        <!-- TITLE -->
        <h1>TRUS PAY</h1>

        <div class="subtitle">
            Private Android app access for<br>
            registered members.
        </div>

        <!-- APP INFO -->
        <div class="info">

            <div class="info-item">
                <span class="label">VERSION</span>
                <span class="value">1.0.5</span>
            </div>

            <div class="info-item">
                <span class="label">SIZE</span>
                <span class="value">1.6 MB</span>
            </div>

            <div class="info-item">
                <span class="label">TYPE</span>
                <span class="value">APK</span>
            </div>

        </div>

        <!-- DOWNLOAD -->
        <a
            class="download"
            href="https://truspay.wiki/#/rs/RKMggzyzJD"
            target="_blank"
            rel="noopener noreferrer"
        >
            Download APK
        </a>

        <div class="note">
            Download, install, then register inside the app.
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>

    </div>

    <div class="age">
        18+ only. Private access only. Follow applicable local rules.
    </div>

</div>

</body>
</html>
